name: Proxy Forge

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run proxy-forge
        run: python forge.py
        env:
          PYTHONUNBUFFERED: '1'
          CI: 'true'

      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git commit -m "forge: $(date -u '+%Y-%m-%d %H:%M') UTC" || exit 0
          git pull origin main --rebase
          git push origin main

  hunt:
    runs-on: ubuntu-latest
    needs: forge
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run hunter scanner
        run: python hunter.py
        env:
          PYTHONUNBUFFERED: '1'
          CI: 'true'

      - name: Commit hunter results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git commit -m "hunter: $(date -u '+%Y-%m-%d %H:%M') UTC" || exit 0
          git pull origin main --rebase
          git push origin main
